# Manually-triggered workflow to re-scrape meetings already stored in the
# DuckDB database, replacing their stored records with freshly parsed data.

name: Rescrape existing meetings

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Rescrape meetings on/after this date (YYYY-MM-DD)"
        required: false
        default: "2022-11-01"
      end_date:
        description: "Rescrape meetings up to this date (YYYY-MM-DD). Empty = today"
        required: false
        default: ""
      meeting_name:
        description: "Meeting name pattern (fnmatch wildcards, e.g. 'City Council'). Empty = same default set as the daily scrape"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: data-branch-scrape
  cancel-in-progress: false

jobs:
  rescrape-meeting-minutes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: data

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.0"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set date range
        env:
          INPUT_END_DATE: ${{ inputs.end_date }}
        run: |
          END_DATE="$INPUT_END_DATE"
          [ -z "$END_DATE" ] && END_DATE=$(date -u +%Y-%m-%d)
          echo "END_DATE=$END_DATE" >> "$GITHUB_ENV"

      - name: Run scraper with --rescrape
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INPUT_MEETING_NAME: ${{ inputs.meeting_name }}
        run: |
          if [ -n "$INPUT_MEETING_NAME" ]; then
            NAME_ARGS=("$INPUT_MEETING_NAME")
          else
            NAME_ARGS=("City Council" "*Committee*" "*Commission*" "*Board*")
          fi

          python -m ottawa_city_scraper.cli \
            --start-date ${{ inputs.start_date }} \
            --end-date ${{ env.END_DATE }} \
            --meeting-name "${NAME_ARGS[@]}" \
            --rescrape \
            --enrich \
            --db-path datasets/ottawa_city_scraper.duckdb

      - name: Check for changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "should_commit=False" >> "$GITHUB_ENV"
          else
            echo "should_commit=True" >> "$GITHUB_ENV"
          fi

      - name: Commit changes
        if: ${{ env.should_commit == 'True' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datasets
          git commit -m "Rescrape: refresh voting records ${{ inputs.start_date }}..${{ env.END_DATE }}"
          git push origin data
